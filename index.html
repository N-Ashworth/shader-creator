<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shader Creator</title>
  </head>
  <body>

    <div class="action-panels">
      <!-- The text area CodeMirror will replace -->
      <textarea id="code-editor"></textarea>

      <!-- The preview panel containing your WebGL canvas and controls -->
      <div class="canvas-stuff">
        <div class="canvas-controls">
          <input type="number" id="res-select-x" value="800" />
          <p>X</p>
          <input type="number" id="res-select-y" value="600" />

          <button id="compile-button">Compile Shader</button>
          <button id="save-button">Save Image</button>
          <input type="text" placeholder="Image Name" id="save-name"></input>
        </div>

        <div class="canvas-preview">
          <canvas id="shader-canvas"></canvas>
        </div>
      </div>
    </div>

    <!-- This links your script directly in the root folder -->
    <script type="module" src="/main.js"></script>
  </body>
</html>
